name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"
  # Lets a maintainer re-run publishing later (e.g. after adding the token,
  # or to pick up a fix that only touches an unpublished crate) without
  # needing to cut a new tag just to retrigger it.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      # GitHub Actions doesn't reliably support referencing `secrets` in a
      # job/step `if:` condition (an earlier version of this workflow tried
      # that at the job level and GitHub rejected the whole workflow file).
      # Checking at runtime instead, gating every later step on this step's
      # output -- skips (doesn't fail) until CARGO_REGISTRY_TOKEN is added as
      # a repo secret. See DISTRIBUTION.md for how to get one; only the repo
      # owner can create/add that token.
      - name: Check CARGO_REGISTRY_TOKEN is configured
        id: check
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set -- skipping crates.io publish. See DISTRIBUTION.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Install nightly (for whyslow-ebpf) + rust-src
        if: steps.check.outputs.ready == 'true'
        run: rustup toolchain install nightly --component rust-src

      - name: Install LLVM/clang dev libs (for bpf-linker)
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libpolly-18-dev libzstd-dev

      - name: Install bpf-linker
        if: steps.check.outputs.ready == 'true'
        run: cargo install bpf-linker --locked

      # Published in dependency order: whyslow-common has no path deps of its
      # own; whyslow-ebpf depends on whyslow-common; whyslow (whyslow-cli's
      # package name) depends on both. Each step is idempotent -- skips if
      # that exact version is already live on crates.io -- so re-running this
      # workflow (e.g. after fixing a bug in a crate published later in the
      # chain) doesn't fail trying to republish an already-published one.
      - name: Publish whyslow-common
        if: steps.check.outputs.ready == 'true'
        working-directory: whyslow-common
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if curl -sf "https://crates.io/api/v1/crates/whyslow-common/$version" > /dev/null; then
            echo "whyslow-common $version already published, skipping"
          else
            cargo publish
            sleep 30 # give crates.io's index a moment before the next crate depends on it
          fi

      # Run from *inside* whyslow-ebpf/, not the workspace root: cargo's
      # config-file discovery (for whyslow-ebpf/.cargo/config.toml, which
      # sets target=bpfel-unknown-none for `cargo publish`'s own standalone
      # verify build) walks up from the invoking process's CWD, not from the
      # package being published -- `-p whyslow-ebpf` alone from the root
      # finds the *workspace* root's .cargo/config.toml instead (which only
      # sets the sudo runner), so the verify build silently targets the host
      # and fails to link a #![no_main] binary as a normal executable.
      - name: Publish whyslow-ebpf
        if: steps.check.outputs.ready == 'true'
        working-directory: whyslow-ebpf
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if curl -sf "https://crates.io/api/v1/crates/whyslow-ebpf/$version" > /dev/null; then
            echo "whyslow-ebpf $version already published, skipping"
          else
            cargo publish
            sleep 30
          fi

      - name: Publish whyslow
        if: steps.check.outputs.ready == 'true'
        working-directory: whyslow-cli
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if curl -sf "https://crates.io/api/v1/crates/whyslow/$version" > /dev/null; then
            echo "whyslow $version already published, skipping"
          else
            cargo publish
          fi
