[package]
# NOT published to crates.io -- see DISTRIBUTION.md "crates.io" section.
# build.rs finds whyslow-ebpf via `cargo_metadata` workspace-member lookup,
# which only resolves when whyslow-ebpf is an actual workspace sibling (true
# when built from a git clone) and fails with "whyslow-ebpf package not
# found" when whyslow-ebpf is instead a plain registry dependency (true for
# a real `cargo install whyslow` from the registry). Confirmed by actually
# trying to publish and hitting exactly that failure, not a hypothetical.
# `cargo install --git https://github.com/kaorii-ako/whyslow whyslow` works
# fine (git installs preserve the workspace) and is the real equivalent.
# The package name stays "whyslow" (directory "whyslow-cli") for when/if a
# future build.rs rewrite fixes this and publishing becomes safe to retry.
publish = false
name = "whyslow"
version = "0.1.1"
edition.workspace = true
license.workspace = true

description = "Debug why a Linux process was slow by correlating sched/futex/block-I/O events into a causal chain"
repository = "https://github.com/kaorii-ako/whyslow"
homepage = "https://github.com/kaorii-ako/whyslow"
readme = "README.md"
keywords = ["ebpf", "tracing", "performance", "debugging", "linux"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "whyslow"
path = "src/main.rs"

[dependencies]
whyslow-common = { path = "../whyslow-common", version = "0.1.1", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[build-dependencies]
anyhow = { workspace = true, default-features = true }
aya-build = { workspace = true, default-features = true }
cargo_metadata = { workspace = true, default-features = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact
# dependency; see whyslow-ebpf/build.rs for why we cargo-in-cargo instead.
whyslow-ebpf = { path = "../whyslow-ebpf", version = "0.1.1" }

[package.metadata.deb]
name = "whyslow"
maintainer = "Tawin Tangsukson <79807@student.amnuaysilpa.ac.th>"
copyright = "2026, Tawin Tangsukson"
license-file = ["../LICENSE-MIT", "0"]
extended-description = """\
whyslow debugs why a Linux process was slow by correlating sched_switch,
futex, and block I/O kernel events into a single causal chain via eBPF,
instead of the disjoint traces strace/perf/py-spy give you in isolation.
whyslow requires root or CAP_BPF to run."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/whyslow", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/whyslow/README.md", "644"],
]
