[package]
name = "whyslow-ebpf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "whyslow's eBPF programs (sched_switch/futex/block-I/O tracepoints) -- internal build dependency of the whyslow crate, not meant to be used standalone"
repository = "https://github.com/kaorii-ako/whyslow"
# Cargo's default file discovery drops dotfiles/dotdirs; .cargo/config.toml
# (which sets target = bpfel-unknown-none for this crate specifically) would
# otherwise silently vanish from the published tarball, breaking the eBPF
# cross-compile for anyone building from crates.io.
include = ["src/**/*", "build.rs", "rust-toolchain.toml", ".cargo/config.toml", "Cargo.toml"]

[dependencies]
whyslow-common = { path = "../whyslow-common", version = "0.1.0" }
aya-ebpf = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "whyslow-ebpf"
path = "src/main.rs"

# Required for a #![no_std] #![no_main] target built with `-Z build-std=core`
# (see .cargo/config.toml): core has no unwinding runtime, so the default
# panic="unwind" strategy can't be satisfied. Our normal build path (via
# whyslow-cli's build.rs -> aya-build) happens to pass this implicitly, so it
# was never missed there -- but `cargo publish`'s own standalone verify build
# of this crate (and a real end-user's `cargo install whyslow`, whose build.rs
# does the same kind of standalone build) doesn't get that for free, and fails
# with "unwinding panics are not supported without std" without it.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
